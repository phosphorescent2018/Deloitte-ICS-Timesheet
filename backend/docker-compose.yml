services:
  postgres:
    image: postgres:17-alpine
    container_name: ics-timesheet-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: timesheet
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet -d timesheet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
